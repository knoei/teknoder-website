</head>


<body>
    <header>
        <nav class="navbar">

      <div class="logo">
        <a href="#home">
          <img src="images/logo.png" alt="Teknoder Teknoloji Logo" class="logo-image">
        </a>
      </div>

      <ul class="nav-items">
        <li>
          <a href="#home">Ana Sayfa</a>

      </ul>
    </nav>

    </header>

    <section class="contact-header">
        <h1>İletişim</h1>
    </section>

   <section class="contact-page">

    <div class="contact-section">

        <div class="contact-image">

            <img src="images/mail.png" alt="İletişim">

        </div>

        <div class="contact-form-section">

            <span class="contact-label">İletişim</span>

            <h2>Bize Ulaşın</h2>

            <p>
                Sorularınız, projeleriniz veya iş birlikleri için bizimle iletişime
                geçebilirsiniz. Ekibimiz en kısa sürede size dönüş sağlayacaktır.
            </p>

            <form class="contact-form">

                <div class="name-row">

                    <input type="text" placeholder="Ad" required>

                    <input type="text" placeholder="Soyad" required>

                </div>

                <input type="email" placeholder="E-posta Adresiniz" required>

                <input type="text" placeholder="Konu" required>

                <textarea placeholder="Mesajınızı buraya yazınız..." rows="6" required></textarea>

                <button type="submit">Gönder</button>

            </form>

        </div>

    </div>

</section>

</body>
